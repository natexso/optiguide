name: ci
on: [push, pull_request]
jobs:
  addon-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with: { luaVersion: 'luajit-2.1' }
      - name: Harness
        run: |
          pre="OptiGuideNS = {} ADDON_FILES = {} "
          for f in OptiGuide/*.lua; do
            n=$(basename "$f")
            pre="$pre ADDON_FILES[\"$n\"] = [==[$(cat "$f")==] "
          done
          { echo "$pre"; cat tests/harness.lua; } > /tmp/bundle.lua
          luajit /tmp/bundle.lua
      - name: Bench
        run: |
          pre="OptiGuideNS = {} ADDON_FILES = {} "
          for f in OptiGuide/*.lua; do
            n=$(basename "$f")
            pre="$pre ADDON_FILES[\"$n\"] = [==[$(cat "$f")==] "
          done
          { echo "$pre"; cat tests/bench.lua; } > /tmp/bench.lua
          luajit /tmp/bench.lua

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: 'fs', scan-ref: '.' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: semgrep
        run: pip install semgrep && semgrep --config auto --error --exclude tests || true

  languages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [rust, julia, cpp]
    steps:
      - uses: actions/checkout@v4
      - name: rust
        if: matrix.lang == 'rust'
        run: rustc --version && echo 'fn main(){println!("ok")}' > /tmp/m.rs && rustc /tmp/m.rs -o /tmp/m && /tmp/m
      - name: julia
        if: matrix.lang == 'julia'
        run: sudo snap install julia --classic && julia -e 'println("ok")'
      - name: cpp
        if: matrix.lang == 'cpp'
        run: g++ --version && echo 'int main(){return 0;}' > /tmp/m.cpp && g++ /tmp/m.cpp -o /tmp/m && /tmp/m

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npx -y playwright@latest --version && npx playwright install --with-deps chromium && npx playwright -e "const{chromium}=require('playwright');chromium.launch().then(b=>{console.log('browser ok');return b.close()})"
